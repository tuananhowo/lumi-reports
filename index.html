<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Danh mục các báo cáo kiểm thử Lumi.">
  <title>Lumi Reports</title>
  <style>
    :root { color-scheme: light; --ink: #173630; --muted: #60746e; --line: #d8e3de; --brand: #087d58; --canvas: #eef4f1; --paper: #fffefa; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(920px, 100% - 36px); margin: 64px auto; }
    header { margin-bottom: 28px; }
    .eyebrow { margin: 0 0 8px; color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 7vw, 48px); letter-spacing: -.05em; }
    header p:last-child { margin: 8px 0 0; color: var(--muted); }
    h2 { margin: 0 0 12px; font-size: 17px; }
    .project { margin-top: 26px; }
    .report { display: flex; justify-content: space-between; gap: 18px; align-items: center; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 10px 30px rgba(18, 61, 53, .06); }
    .report h3 { margin: 0; font-size: 17px; }
    .meta { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .summary { margin: 8px 0 0; font-size: 13px; }
    .status { flex: 0 0 auto; padding: 5px 10px; border-radius: 99px; color: #806019; background: #fff1cf; font-size: 11px; font-weight: 800; }
    a { color: inherit; text-decoration: none; }
    .report:hover { border-color: var(--brand); }
    @media (max-width: 600px) { main { margin: 38px auto; } .report { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Quality reports</p>
      <h1>Lumi Reports</h1>
      <p>Báo cáo được sắp xếp theo project, chức năng và ngày chạy.</p>
    </header>
    <section class="project" aria-labelledby="lumi-iot-heading">
      <h2 id="lumi-iot-heading">lumi_iot</h2>
      <a class="report" href="projects/lumi_iot/notifications/2026-11-05-notification-additions-01/">
        <div>
          <h3>Thông báo 2.2.0 — kiểm thử các bổ sung</h3>
          <p class="meta">Notifications · 2026-11-05 · 7 case</p>
          <p class="summary">4 PASS · 3 BLOCKED · Chưa hoàn tất</p>
        </div>
        <span class="status">CHƯA HOÀN TẤT</span>
      </a>
    </section>
  </main>
</body>
</html>
